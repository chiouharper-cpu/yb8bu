<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07121f"/>
      <stop offset="0.7" stop-color="#153250"/>
      <stop offset="1" stop-color="#244a6e"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fe3c1" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#4fe3c1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7aa8ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d27a"/>
      <stop offset="0.28" stop-color="#fbf4e2"/>
      <stop offset="1" stop-color="#eef3f7"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcebf5"/>
      <stop offset="1" stop-color="#9fbfd6"/>
    </linearGradient>
  </defs>

  <!-- 夜空 -->
  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- 極光 -->
  <path d="M0 90 C150 20 280 150 430 70 S680 40 800 110 L800 150 C680 90 560 140 430 115 S150 70 0 140 Z" fill="url(#aurora)"/>
  <path d="M0 150 C200 90 330 190 520 130 S720 120 800 160 L800 180 C700 150 560 175 500 160 S200 130 0 175 Z" fill="url(#aurora)" opacity="0.6"/>

  <!-- 星星 -->
  <g fill="#ffffff">
    <circle cx="60" cy="40" r="1.5"/><circle cx="140" cy="200" r="1"/>
    <circle cx="330" cy="30" r="1.2"/><circle cx="520" cy="60" r="1.5"/>
    <circle cx="610" cy="210" r="1"/><circle cx="720" cy="35" r="1.3"/>
    <circle cx="760" cy="230" r="1"/><circle cx="420" cy="210" r="1"/>
  </g>

  <!-- 冰原 -->
  <path d="M0 380 C200 360 560 365 800 385 L800 450 L0 450 Z" fill="url(#ice)"/>
  <ellipse cx="270" cy="415" rx="130" ry="14" fill="#7c9db6" opacity="0.5"/>

  <!-- 成鳥 -->
  <g>
    <ellipse cx="250" cy="290" rx="72" ry="122" fill="#1a1e27"/>
    <ellipse cx="190" cy="300" rx="16" ry="72" transform="rotate(10 190 300)" fill="#10131a"/>
    <ellipse cx="268" cy="302" rx="50" ry="106" fill="url(#belly)"/>
    <ellipse cx="228" cy="410" rx="22" ry="8" fill="#2a2d33"/>
    <ellipse cx="280" cy="410" rx="22" ry="8" fill="#2a2d33"/>
    <circle cx="255" cy="165" r="42" fill="#14171e"/>
    <ellipse cx="262" cy="198" rx="13" ry="26" transform="rotate(-18 262 198)" fill="#f2b441"/>
    <path d="M286 156 L334 172 L286 180 Z" fill="#23262d"/>
    <path d="M292 177 L330 173" stroke="#f28c38" stroke-width="4" stroke-linecap="round"/>
    <circle cx="276" cy="157" r="3.5" fill="#000"/>
    <circle cx="277" cy="156" r="1.2" fill="#fff"/>
  </g>

  <!-- 幼鳥 -->
  <g>
    <ellipse cx="350" cy="375" rx="30" ry="38" fill="#a3adb8"/>
    <ellipse cx="338" cy="410" rx="10" ry="5" fill="#2a2d33"/>
    <ellipse cx="362" cy="410" rx="10" ry="5" fill="#2a2d33"/>
    <circle cx="350" cy="325" r="22" fill="#1a1e27"/>
    <ellipse cx="353" cy="331" rx="15" ry="12" fill="#ffffff"/>
    <circle cx="346" cy="328" r="2.2" fill="#000"/>
    <circle cx="359" cy="328" r="2.2" fill="#000"/>
    <path d="M350 334 L356 337 L350 339 Z" fill="#23262d"/>
  </g>

  <!-- 文字 -->
  <text x="610" y="215" text-anchor="middle" font-family="Georgia, serif" font-size="40" letter-spacing="3" fill="#f3f6f9">EMPEROR</text>
  <text x="610" y="258" text-anchor="middle" font-family="Georgia, serif" font-size="40" letter-spacing="3" fill="#f3f6f9">PENGUIN</text>
  <line x1="510" y1="278" x2="710" y2="278" stroke="#f2b441" stroke-width="1.5"/>
  <text x="610" y="310" text-anchor="middle" font-family="'Noto Serif TC', 'PMingLiU', serif" font-size="22" letter-spacing="8" fill="#f2b441">皇帝企鵝</text>
  <text x="610" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" letter-spacing="3" fill="#b8cde0">KING OF THE ANTARCTIC ICE</text>
</svg>
